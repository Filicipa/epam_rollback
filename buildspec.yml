version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11

  pre_build:
    commands:
      - python --version
      - pip --version

  build:
    commands:
      - pip install -r requirements.txt
      - python -m py_compile app.py

artifacts:
  files:
    - app.py
    - requirements.txt
    - appspec.yml
    - scripts/**/*
